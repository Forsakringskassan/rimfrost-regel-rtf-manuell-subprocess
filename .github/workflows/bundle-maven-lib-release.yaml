name: Bundle Maven Lib Release

on: [workflow_dispatch]

jobs:
  call-app-generic-conventional-release:
    uses: Forsakringskassan/.github/.github/workflows/generic-conventional-release.yaml@7dc0edc0051d2e7b37cfbe45b51841141ee3a835 # main

  call-maven-release:
    if: needs.call-app-generic-conventional-release.outputs.is-new-version == 'true'
    needs: call-app-generic-conventional-release
    uses: Forsakringskassan/.github/.github/workflows/maven-release.yaml@7dc0edc0051d2e7b37cfbe45b51841141ee3a835 # main
    with:
      version: ${{ needs.call-app-generic-conventional-release.outputs.current-version }}

  publish-release:
    if: needs.call-app-generic-conventional-release.outputs.is-new-version == 'true'
    needs: [call-app-generic-conventional-release, call-maven-release]
    uses: Forsakringskassan/.github/.github/workflows/publish-release-on-tag-push.yaml@7dc0edc0051d2e7b37cfbe45b51841141ee3a835 # main

